[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wing-sloshing"
version = "0.1.0"
description = "Reduced-order modelling of fuel redistribution and centre-of-gravity migration in a tapered wing tank."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]
