[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wing-tank-slosh"
version = "0.1.0"
description = "Reduced-order model for fuel redistribution in a tapered wing tank"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
